<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYTI - Mobile Responsive Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .kenyan-flag { background: linear-gradient(to bottom, #000 25%, #FFF 25%, #FFF 30%, #BB0000 30%, #BB0000 70%, #FFF 70%, #FFF 75%, #006600 75%); height: 6px; width: 100%; position: fixed; top: 0; z-index: 100; }
        .flag-green { background-color: #006600; }
        .text-flag-green { color: #006600; }
        .text-flag-red { color: #BB0000; }
        /* Ensures tables don't break the layout on small screens */
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900 overflow-x-hidden">
    <div class="kenyan-flag"></div>

    <div class="fixed bottom-4 right-4 md:top-6 md:right-6 z-[200]">
        <select onchange="switchView(this.value)" class="bg-black text-white text-sm font-bold p-4 rounded-2xl shadow-2xl border border-white/20 outline-none">
            <option value="login">1. Access Portal</option>
            <option value="mobilizer">2. Mobilizer View</option>
            <option value="subcounty">3. Sub-County</option>
            <option value="county">4. County (Siaya)</option>
            <option value="national">5. National Oversight</option>
        </select>
    </div>

    <section id="view-login" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[2rem] shadow-xl overflow-hidden border">
            <div class="flag-green p-8 text-center text-white">
                <h1 class="text-4xl font-black italic">KYTI</h1>
                <p class="text-[10px] font-bold uppercase tracking-widest mt-1">Access Portal</p>
            </div>
            <div class="p-6 space-y-4">
                <select id="loginRole" class="w-full p-4 border rounded-xl font-bold text-sm bg-slate-50">
                    <option value="mobilizer">Community Mobilizer</option>
                    <option value="national">National Admin</option>
                </select>
                <input type="text" placeholder="ID Number / Username" class="w-full p-4 border rounded-xl text-base outline-none focus:border-green-600">
                <input type="password" placeholder="Password" class="w-full p-4 border rounded-xl text-base outline-none focus:border-green-600">
                <button onclick="switchView(document.getElementById('loginRole').value)" class="w-full flag-green text-white p-4 rounded-xl font-black uppercase text-sm shadow-lg">Sign In</button>
            </div>
        </div>
    </section>

    <section id="view-mobilizer" class="hidden pt-16 p-4 max-w-md mx-auto space-y-4">
        <div class="bg-white p-6 rounded-3xl shadow-md border text-center">
            <div class="w-20 h-20 bg-slate-200 rounded-full mx-auto mb-3 border-2 border-flag-green"></div>
            <h2 class="text-xl font-black">Otieno Okello</h2>
            <p class="text-xs font-bold text-flag-green uppercase">Central Ward, Siaya</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-5 rounded-3xl shadow-sm border-b-4 border-black text-center">
                <p class="text-[10px] uppercase font-bold text-slate-400">Checked</p>
                <p class="text-3xl font-black">156</p>
            </div>
            <div onclick="toggleModal('redList')" class="bg-white p-5 rounded-3xl shadow-sm border-b-4 border-red-600 text-center">
                <p class="text-[10px] uppercase font-bold text-red-400">Red List</p>
                <p class="text-3xl font-black text-red-600">42</p>
            </div>
        </div>
        <div class="bg-slate-900 p-6 rounded-[2rem] shadow-lg">
            <p class="text-white text-[10px] font-bold uppercase mb-3 opacity-60">Voter Verification</p>
            <input type="number" placeholder="Enter ID Number" class="w-full p-4 rounded-xl mb-3 text-lg font-bold">
            <button class="w-full bg-red-600 text-white p-4 rounded-xl font-black uppercase text-sm">Verify ID</button>
        </div>
    </section>

    <section id="view-national" class="hidden pt-16 p-4 max-w-4xl mx-auto">
        <div class="bg-black text-white p-6 rounded-[2rem] mb-6">
            <h2 class="text-2xl font-black italic uppercase">National Oversight</h2>
            <div class="flex flex-wrap gap-2 mt-4">
                <button onclick="alert('Downloading...')" class="flex-1 bg-white text-black text-[10px] font-black p-3 rounded-lg uppercase">Export Excel</button>
                <button class="flex-1 bg-green-600 text-white text-[10px] font-black p-3 rounded-lg uppercase">Bulk M-Pesa</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="bg-white p-4 rounded-2xl border shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Verified</p>
                <p class="text-xl font-black text-flag-green">48,290</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border shadow-sm">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Payout Due</p>
                <p class="text-xl font-black text-red-600">24.1M</p>
            </div>
        </div>

        <div class="table-container bg-white rounded-2xl shadow-md border">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-100 text-[10px] font-black uppercase text-slate-500">
                    <tr>
                        <th class="p-4 whitespace-nowrap">County</th>
                        <th class="p-4 whitespace-nowrap text-right">Verified</th>
                        <th class="p-4 whitespace-nowrap text-right">Status</th>
                    </tr>
                </thead>
                <tbody class="text-sm font-bold">
                    <tr class="border-t">
                        <td class="p-4">SIAYA</td>
                        <td class="p-4 text-right">44,230</td>
                        <td class="p-4 text-right text-flag-green">PAID</td>
                    </tr>
                    <tr class="border-t">
                        <td class="p-4">NAIROBI</td>
                        <td class="p-4 text-right">95,000</td>
                        <td class="p-4 text-right text-orange-500">WAIT</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        function switchView(viewId) {
            const views = ['view-login', 'view-mobilizer', 'view-subcounty', 'view-county', 'view-national'];
            views.forEach(v => document.getElementById(v)?.classList.add('hidden'));
            document.getElementById('view-' + viewId).classList.remove('hidden');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
